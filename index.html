<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACQI</title>
<meta name="description" content="ACQI: IT due diligence and migration for M&amp;A.">
<style>
  :root {
    color-scheme: light dark;
    --ink: #16181d;
    --page: #ffffff;
    --rule: #d8dbe2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2f3f5;
      --page: #101216;
      --rule: #2a2e36;
    }
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
  }
  main {
    width: 100%;
    max-width: 40rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 1.1rem + 2vw, 2.5rem);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  p {
    margin: 2rem 0 0;
    padding-top: 2rem;
    border-top: 1px solid var(--rule);
    font-size: 1.0625rem;
  }
  a {
    color: inherit;
    text-underline-offset: 0.2em;
  }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
  }
</style>
</head>
<body>
<main>
  <h1>ACQI: IT due diligence and migration for M&amp;A.</h1>
  <p>Request access: <a href="mailto:operations@acqi.ai">operations@acqi.ai</a></p>
</main>
</body>
</html>
